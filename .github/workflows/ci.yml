name: CI

on:
  pull_request:
    branches: [main, prod]
  push:
    branches: [main, prod]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify files exist
        run: |
          echo "Repository contents:"
          ls -la
          echo "---"
          echo "bsu-portal-example contents:"
          ls -la bsu-portal-example/
          echo "---"
          if [ -f "bsu-portal-example/package-lock.json" ]; then
            echo "✓ Lock file found in bsu-portal-example"
          else
            echo "✗ Lock file NOT found in bsu-portal-example"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./bsu-portal-example/package-lock.json"

      - name: Install dependencies
        working-directory: bsu-portal-example
        run: npm ci

      - name: Run tests
        working-directory: bsu-portal-example
        run: npm test