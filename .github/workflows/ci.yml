name: CI
on:
  pull_request:
    branches: [main, prod]
  push:
    branches: [main, prod]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Debug files
        run: |
          echo "Current directory:"
          pwd
          echo "Root contents:"
          ls -la
          echo "Lock file check:"
          

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        working-directory: 
        run: npm ci

      - name: Run tests
        working-directory: 
        run: npm test