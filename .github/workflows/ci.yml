name: CI
on:
  pull_request:
    branches: [main, prod]
  push:
    branches: [main, prod]

jobs:
  test:
    runs-on: ubuntu-latest
    environment: .env.test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Debug Supabase env presence (safe)
        env:
          # Supabase keys REQUIRED for middleware / server
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

          # Contentstack keys required by demo-instructions routes
          CONTENTSTACK_API_KEY: ${{ secrets.CONTENTSTACK_API_KEY }}
          CONTENTSTACK_MANAGEMENT_TOKEN: ${{ secrets.CONTENTSTACK_MANAGEMENT_TOKEN }}
          CONTENTSTACK_ENVIRONMENT: ${{ secrets.CONTENTSTACK_ENVIRONMENT }}

          # your integration test harness vars
          TEST_BASE_URL: http://localhost:3005
          TEST_PARTNER_EMAIL: ${{ secrets.TEST_PARTNER_EMAIL }}
          TEST_CONTENTSTACK_EMAIL: ${{ secrets.TEST_CONTENTSTACK_EMAIL }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_HOMEPAGE_ENTRY_UID: ${{ secrets.TEST_HOMEPAGE_ENTRY_UID }}
        run: |
          node -e "console.log('URL present?', !!process.env.NEXT_PUBLIC_SUPABASE_URL)"
          node -e "console.log('KEY present?', !!process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY)"
          node -e "console.log('CONTENTSTACK_API_KEY present?', !!process.env.CONTENTSTACK_API_KEY)"
          node -e "console.log('CONTENTSTACK_MANAGEMENT_TOKEN present?', !!process.env.CONTENTSTACK_MANAGEMENT_TOKEN)"
          node -e "console.log('CONTENTSTACK_ENVIRONMENT present?', !!process.env.CONTENTSTACK_ENVIRONMENT)"
          node -e "console.log('CONTENTSTACK_ENVIRONMENT value:', JSON.stringify(process.env.CONTENTSTACK_ENVIRONMENT))"
          node -e "console.log('TEST_PARTNER_EMAIL present?', !!process.env.TEST_PARTNER_EMAIL)"
          node -e "console.log('TEST_CONTENTSTACK_EMAIL present?', !!process.env.TEST_CONTENTSTACK_EMAIL)"
          node -e "console.log('TEST_ADMIN_EMAIL present?', !!process.env.TEST_ADMIN_EMAIL)"
          node -e "console.log('TEST_USER_PASSWORD present?', !!process.env.TEST_USER_PASSWORD)"

      - name: Run integration tests
        env:
          # Supabase keys REQUIRED for middleware / server
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

          # Contentstack keys required by demo-instructions routes
          CONTENTSTACK_API_KEY: ${{ secrets.CONTENTSTACK_API_KEY }}
          CONTENTSTACK_MANAGEMENT_TOKEN: ${{ secrets.CONTENTSTACK_MANAGEMENT_TOKEN }}
          CONTENTSTACK_ENVIRONMENT: ${{ secrets.CONTENTSTACK_ENVIRONMENT }}

          # your integration test harness vars
          TEST_BASE_URL: http://localhost:3005
          TEST_PARTNER_EMAIL: ${{ secrets.TEST_PARTNER_EMAIL }}
          TEST_CONTENTSTACK_EMAIL: ${{ secrets.TEST_CONTENTSTACK_EMAIL }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_HOMEPAGE_ENTRY_UID: ${{ secrets.TEST_HOMEPAGE_ENTRY_UID }}

          # if anything server-side needs it
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:integration
